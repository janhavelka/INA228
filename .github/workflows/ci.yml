name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio run -e ${{ matrix.environment }} 2>&1 | tee platformio-${{ matrix.environment }}.log

      - name: Upload PlatformIO build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platformio-build-${{ matrix.environment }}
          path: platformio-${{ matrix.environment }}.log
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Enforce core timing guard
        run: |
          set -o pipefail
          python tools/check_core_timing_guard.py 2>&1 | tee core-timing-guard.log

      - name: Run native tests
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee native-test-results.log

      - name: Upload native test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            core-timing-guard.log
            native-test-results.log
          if-no-files-found: error

  esp-idf-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP-IDF basic ${{ matrix.target }} with idf.py
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Upload ESP-IDF build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp-idf-build-logs-${{ matrix.target }}
          path: |
            examples/esp_idf/basic/build/**/*.log
            examples/esp_idf/basic/build/log/**
          if-no-files-found: ignore

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run static contract checks
        run: |
          set -o pipefail
          mkdir -p static-contract-logs
          python -m py_compile tools/run_i2c_hil.py 2>&1 | tee static-contract-logs/py_compile_run_i2c_hil.log
          python tools/run_i2c_hil.py --parser-self-test 2>&1 | tee static-contract-logs/hil_parser_self_test.log
          python tools/check_cli_contract.py 2>&1 | tee static-contract-logs/check_cli_contract.log
          python tools/check_idf_example_contract.py 2>&1 | tee static-contract-logs/check_idf_example_contract.log
          python tools/check_core_timing_guard.py 2>&1 | tee static-contract-logs/check_core_timing_guard.log
          python scripts/generate_version.py check 2>&1 | tee static-contract-logs/generate_version_check.log

      - name: Upload static contract logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-contract-logs
          path: static-contract-logs/
          if-no-files-found: error

      - name: Validate library package
        run: pio pkg pack

      - name: Upload PlatformIO package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platformio-package
          path: "*.tar.gz"
          if-no-files-found: error

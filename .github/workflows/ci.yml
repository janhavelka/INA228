name: CI

env:
  PLATFORMIO_VERSION: "6.1.19"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build ${{ matrix.environment }}
        run: |
          set -o pipefail
          pio run -e ${{ matrix.environment }} 2>&1 | tee platformio-${{ matrix.environment }}.log

      - name: Upload PlatformIO build log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platformio-build-${{ matrix.environment }}
          path: platformio-${{ matrix.environment }}.log
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Run native tests
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee native-test-results.log

      - name: Upload native test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-test-results
          path: native-test-results.log
          if-no-files-found: error

  esp-idf-basic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build ESP-IDF basic ${{ matrix.target }} with idf.py
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Upload ESP-IDF build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: esp-idf-build-logs-${{ matrix.target }}
          path: |
            examples/esp_idf/basic/build/**/*.log
            examples/esp_idf/basic/build/log/**
          if-no-files-found: ignore

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz

      - name: Run static contract checks
        run: |
          set -o pipefail
          mkdir -p static-contract-logs
          python -m py_compile tools/*.py scripts/generate_version.py 2>&1 | tee static-contract-logs/py_compile.log
          python tools/run_i2c_hil.py --parser-self-test 2>&1 | tee static-contract-logs/hil_parser_self_test.log
          python tools/run_i2c_hil.py --dry-run --suite exhaustive --include-not-run --benchmark-count 100 2>&1 | tee static-contract-logs/hil_exhaustive_dry_run.log
          python tools/test_run_i2c_hil_parser.py 2>&1 | tee static-contract-logs/hil_parser_regression_tests.log
          python tools/check_cli_contract.py 2>&1 | tee static-contract-logs/check_cli_contract.log
          python tools/check_idf_example_contract.py 2>&1 | tee static-contract-logs/check_idf_example_contract.log
          python tools/check_core_timing_guard.py 2>&1 | tee static-contract-logs/check_core_timing_guard.log
          python tools/check_owner_contract.py 2>&1 | tee static-contract-logs/check_owner_contract.log
          python scripts/generate_version.py check 2>&1 | tee static-contract-logs/generate_version_check.log

      - name: Build API documentation with warnings as errors
        run: |
          set -o pipefail
          doxygen Doxyfile 2>&1 | tee static-contract-logs/doxygen.log

      - name: Upload static contract logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-contract-logs
          path: static-contract-logs/
          if-no-files-found: error

      - name: Validate library package
        run: pio pkg pack

      - name: Verify packaged public library
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -name 'INA228-*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | sort | tee package-contents.log
          for path in \
            library.json \
            README.md \
            LICENSE \
            CMakeLists.txt \
            idf_component.yml \
            include/INA228/CommandTable.h \
            include/INA228/INA228.h \
            include/INA228/Status.h \
            include/INA228/Version.h \
            docs/integration/esp-idf.md \
            docs/reference/ina228-device-reference.md \
            docs/validation/validation-status.md \
            docs/validation/hardware-validation-procedure.md \
            src/INA228.cpp; do
            grep -Fx "$path" package-contents.log
          done
          for prefix in \
            .github/ \
            .pio/ \
            .vscode/ \
            docs/doxygen/ \
            docs/reference/vendor/ \
            docs/validation/hardware/ \
            scripts/ \
            test/ \
            tools/; do
            ! grep -Fq "$prefix" package-contents.log
          done
          mkdir package-smoke
          tar -xzf "$archive" -C package-smoke
          g++ -std=c++17 -Wall -Wextra -Werror=return-type \
            -Ipackage-smoke/include -c package-smoke/src/INA228.cpp \
            -o package-smoke/INA228.o
          python - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("package-smoke")
          readme = (root / "README.md").read_text(encoding="utf-8")
          links = re.findall(r"\[[^]]+\]\(([^)]+)\)", readme)
          links += re.findall(r'href=["\']([^"\']+)["\']', readme)
          for link in links:
              target = link.split("#", 1)[0]
              if target and "://" not in target and not target.startswith("mailto:"):
                  assert (root / target).is_file(), f"missing README target: {target}"
          PY

      - name: Upload PlatformIO package
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: platformio-package
          path: "*.tar.gz"
          if-no-files-found: error
